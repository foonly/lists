name: Release

on:
  push:
    tags:
      - "v*"

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: make
        env:
          VITE_API_BASE_URL: "https://blob.foonly.dev"
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.KNOWN_HOSTS }}
      - name: Deploy Files
        # The key is restricted on the server to rsync into this site's web root
        # (rrsync), so the destination path is relative to it.
        run: rsync -rlci --delete dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:./"
